<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <title>Login | Shoop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/Shoop/login/styles.css">
  <link rel="stylesheet" href="/Shoop/styles.css">

  <!-- Favicons -->
  <link rel="icon" href="/Shoop/images/icon-32.png" sizes="32x32">
  <link rel="icon" href="/Shoop/images/icon-192.png" sizes="192x192">
  <link rel="icon" href="/Shoop/images/icon-512.png" sizes="512x512">

  <link rel="manifest" href="/Shoop/manifest.json">

  <script src="/Shoop/registerServiceWorker.js" defer></script>
  <script type="module" src="/Shoop/general.js"></script>
</head>

<body>
  <header class="topbar">
    <button id="menuBtn" aria-label="Menu">☰</button>

    <a id="profileLink">
      <img id="avatar" src="/Shoop/noProfile.webp" alt="Profile">
    </a>
  </header>

  <div class="other"></div>
  <h1>Login</h1>

  <form id="loginForm">
    <input id="emailInput" type="email" placeholder="Email" autofill="email" required>
    <input id="passwordInput" type="password" placeholder="Password" autofill="current-password" required>
    <button type="submit">Login / Sign up</button>
  </form>

  <script type="module" href="/Shoop/login/main.js"></script>
</body>

</html>
